<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de vida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <script>
    // El tema se pone antes de pintar, para que no parpadee
    try { const t = localStorage.getItem('panel2:tema'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
</head>
<body>
  <aside class="lateral" aria-label="Menú">
    <div class="marca">
      <span class="marca-logo" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="marca-texto">Panel de vida <em>2.0</em></span>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="lateral-pie">
      <div class="sync" id="sync"></div>
      <div class="ano" id="ano"></div>
      <div class="usuario">
        <span class="avatar" id="avatar">V</span>
        <div class="usuario-texto"><strong id="usuario-nombre">Víctor</strong><small>Mi panel</small></div>
        <button class="boton-icono" id="boton-tema" title="Cambiar entre modo claro y oscuro" aria-label="Cambiar entre modo claro y oscuro"></button>
      </div>
    </div>
  </aside>

  <main class="principal">
    <section class="hero tarjeta" id="hoy" aria-label="Hoy"></section>

    <div class="rejilla">
      <section class="tarjeta t-calendario" id="calendario"></section>
      <section class="tarjeta t-vence" id="vence"></section>

      <section class="tarjeta t-dinero" id="dinero"></section>

      <section class="tarjeta t-habitos" id="habitos"></section>
      <section class="tarjeta t-salud" id="salud"></section>

      <section class="tarjeta t-suscripciones" id="suscripciones"></section>
      <section class="tarjeta t-objetivos" id="objetivos"></section>
      <section class="tarjeta t-gente" id="gente"></section>

      <section class="tarjeta t-ahorro" id="ahorro"></section>
      <section class="tarjeta t-datos" id="datos"></section>
      <section class="tarjeta t-nota" id="nota"></section>
    </div>

    <footer class="pie">
      <span>Hecho con Claude Code · Tus datos se quedan en tu ordenador</span>
      <button class="enlace" id="restablecer">Restablecer los datos de ejemplo</button>
    </footer>
  </main>

  <dialog class="modal" id="modal-gasto">
    <form method="dialog" id="form-gasto">
      <h3>Nuevo gasto</h3>
      <label>Concepto<input name="concepto" required placeholder="Supermercado" autocomplete="off"></label>
      <label>Importe (€)<input name="importe" required inputmode="decimal" placeholder="24,90" autocomplete="off"></label>
      <label>Categoría<select name="categoria" id="gasto-categoria"></select></label>
      <div class="modal-botones">
        <button type="button" class="boton boton-suave" id="gasto-cancelar">Cancelar</button>
        <button type="submit" class="boton boton-fuerte">Guardar</button>
      </div>
    </form>
  </dialog>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="js/datos.js"></script>
  <script src="js/calendario.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
